global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kindmelody-backend'
    static_configs:
      - targets: ['kindmelody-backend:8000']
    metrics_path: '/api/v1/health/metrics'
    scrape_interval: 15s

  - job_name: 'kindmelody-worker'
    static_configs:
      - targets: ['kindmelody-worker:8000']
    metrics_path: '/api/v1/health/metrics'
    scrape_interval: 30s
