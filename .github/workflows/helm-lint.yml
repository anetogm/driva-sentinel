name: Helm Lint

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/helm/**'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/helm/**'

jobs:
  lint:
    name: Lint Helm Charts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.16.0'

      - name: Lint Helm Chart
        run: |
          helm lint infrastructure/helm/kindmelody

      - name: Template validation
        run: |
          helm template kindmelody infrastructure/helm/kindmelody --debug > /dev/null
