apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kindmelody-staging

resources:
  - ../../base

namePrefix: staging-

patches:
  - target:
      kind: Deployment
      name: kindmelody-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: kindmelody-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: kindmelody-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: kindmelody-backend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5
  - target:
      kind: Ingress
      name: kindmelody-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.kindmelody.dev
      - op: replace
        path: /spec/tls/0/hosts
        value: ["staging.kindmelody.dev"]
