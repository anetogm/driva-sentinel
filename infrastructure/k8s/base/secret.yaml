apiVersion: v1
kind: Secret
metadata:
  name: kindmelody-secrets
  namespace: kindmelody
type: Opaque
stringData:
  SECRET_KEY: "change-me-in-production-use-kubectl-create-secret"
  DATABASE_URL: "postgresql+asyncpg://kindmelody:kindmelody@postgres:5432/kindmelody"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis:6379/2"