apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: kindmelody
  labels:
    app: kindmelody
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kindmelody
      component: redis
  template:
    metadata:
      labels:
        app: kindmelody
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: kindmelody
  labels:
    app: kindmelody
    component: redis
spec:
  type: ClusterIP
  selector:
    app: kindmelody
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
