apiVersion: v1
kind: Service
metadata:
  name: kindmelody-frontend
  namespace: kindmelody
  labels:
    app: kindmelody
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: kindmelody
    component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP