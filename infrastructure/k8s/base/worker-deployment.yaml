apiVersion: apps/v1
kind: Deployment
metadata:
  name: kindmelody-worker
  namespace: kindmelody
  labels:
    app: kindmelody
    component: worker
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kindmelody
      component: worker
  template:
    metadata:
      labels:
        app: kindmelody
        component: worker
    spec:
      containers:
        - name: worker
          image: kindmelody/worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: kindmelody-config
            - secretRef:
                name: kindmelody-secrets
          resources:
            requests:
              cpu: "300m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.queue.celery_app
                - inspect
                - ping
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL