apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kindmelody-backend-hpa
  namespace: kindmelody
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kindmelody-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60