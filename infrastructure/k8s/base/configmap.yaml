apiVersion: v1
kind: ConfigMap
metadata:
  name: kindmelody-config
  namespace: kindmelody
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  APP_NAME: "KindMelody Security Scanner"
  APP_VERSION: "1.0.0"
  API_V1_PREFIX: "/api/v1"
  SCAN_TIMEOUT_SECONDS: "300"
  SCANNER_TIMEOUT_SECONDS: "30"
  MAX_SCANNERS_CONCURRENT: "7"
  RATE_LIMIT_PER_MINUTE: "10"
  RATE_LIMIT_PER_HOUR: "100"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  CORS_ORIGINS: '["https://kindmelody.dev"]'
  OTEL_SERVICE_NAME: "kindmelody-backend"