{{- if .Values.backend.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kindmelody.fullname" . }}-backend-pdb
  labels:
    {{- include "kindmelody.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.backend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "kindmelody.selectorLabels" . | nindent 6 }}
      component: backend
{{- end }}
